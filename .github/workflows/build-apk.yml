name: Generar APK GS ADMIN

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK release
        run: gradle clean assembleRelease --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk GS-ADMIN-1.0.0.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: GS-ADMIN-1.0.0
          path: GS-ADMIN-1.0.0.apk
